name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: myyjjtclthflfgxkgubr

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub secret is missing. Create a token at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - name: Link Supabase project
        continue-on-error: true
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        continue-on-error: true
        run: supabase db push

      - name: Deploy edge functions
        run: |
          supabase functions deploy delete-account analyze-meal describe-meal \
            --project-ref "$SUPABASE_PROJECT_ID"
